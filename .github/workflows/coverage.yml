# Unit tests + coverage, reported back to the Content Studio.
#
# The studio's scheduler dispatches this daily and then READS this run: its
# conclusion becomes the project's "unit tests" tag, and the MONITOR_COVERAGE
# line below becomes its "coverage %" tag and the shields endpoint the studio
# publishes. Nothing is committed here, no secret is needed, and the README is
# maintained by the studio — do not add badges to it by hand.
name: Coverage

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A newer run supersedes an in-flight one on the same ref — a daily dispatch
# landing on top of a push must not queue behind it.
concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Must precede setup-node: `cache: pnpm` needs the pnpm binary on PATH to
      # resolve the store path. Version comes from package.json#packageManager —
      # v6 is the first action release that supports pnpm 11.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # json-summary is what the studio parses; lcov is kept for humans, and the
      # json reporter supplies the test counts the dashboard shows next to the
      # conclusion. vitest.config.js already pins the v8 provider and the 100%
      # thresholds, so a coverage regression fails this run on its own.
      - name: Run tests with coverage
        run: >-
          pnpm exec vitest run --coverage
          --coverage.reporter=json-summary
          --coverage.reporter=text
          --coverage.reporter=lcov
          --reporter=default
          --reporter=json
          --outputFile.json=.vitest.json

      # `always()` on purpose: a failing suite still measured something, and the
      # studio shows the red unit-tests tag NEXT TO a real percentage. Skipping
      # this on failure would blank the badge exactly when it matters most.
      #
      # `::notice::` rather than a bare echo so the line survives as a run
      # annotation after the log itself expires — the studio falls back to it.
      - name: Report to the studio
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const read = (p) => { try { return JSON.parse(fs.readFileSync(p, "utf8")); } catch { return null; } };

            // No summary means nothing was instrumented: report null, never 0 —
            // a red 0% on a fully covered repo is a lie shields would cache.
            const summary = read("./coverage/coverage-summary.json");
            const lines = summary?.total?.lines;
            const out = lines && lines.total > 0
              ? { pct: lines.pct, lines: { covered: lines.covered, total: lines.total } }
              : { pct: null };

            const results = read("./.vitest.json");
            if (results) {
              out.tests = {
                passed: results.numPassedTests,
                failed: results.numFailedTests,
                skipped: results.numPendingTests,
              };
            }

            console.log("::notice title=coverage::MONITOR_COVERAGE " + JSON.stringify(out));
          '
